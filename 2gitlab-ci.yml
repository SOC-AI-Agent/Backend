stages:
  - build
  - test
  - deploy

# ==========================================
# 1. BUILD STAGE
# ==========================================
generate_env:
  stage: build
  image: alpine:latest
  tags:
    - llm
  before_script:
    - apk add --no-cache gettext sed
  script:
    - cp .env.example .env
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        sed -i "s|POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=${PROD_POSTGRES_PASSWORD}|g" .env
        sed -i "s|postgresql+asyncpg://.*:.*@.*:5432/.*|postgresql+asyncpg://${PROD_POSTGRES_USER}:${PROD_POSTGRES_PASSWORD}@${PROD_POSTGRES_HOST}:5432/${PROD_POSTGRES_DB}|g" .env
        sed -i "s|JWT_SECRET_KEY=.*|JWT_SECRET_KEY=${PROD_JWT_SECRET_KEY}|g" .env
        sed -i "s|DEFAULT_ADMIN_PASSWORD=.*|DEFAULT_ADMIN_PASSWORD=${PROD_ADMIN_PASSWORD}|g" .env
      else
        sed -i "s|POSTGRES_DB=.*|POSTGRES_DB=socai_dev|g" .env 
        sed -i "s|POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=${DEV_POSTGRES_PASSWORD}|g" .env
        sed -i "s|postgresql+asyncpg://.*:.*@.*:5432/.*|postgresql+asyncpg://socai:${DEV_POSTGRES_PASSWORD}@soc-db-dev:5432/socai_dev|g" .env
        sed -i "s|JWT_SECRET_KEY=.*|JWT_SECRET_KEY=${DEV_JWT_SECRET_KEY}|g" .env
        sed -i "s|DEFAULT_ADMIN_PASSWORD=.*|DEFAULT_ADMIN_PASSWORD=${DEV_ADMIN_PASSWORD}|g" .env
      fi
    - cat .env | grep -v "PASSWORD" | grep -v "SECRET" | grep -v "URL"
  artifacts:
    name: "dotenv-file-${CI_COMMIT_REF_SLUG}"
    expire_in: 1 week
    paths:
      - .env
  rules:
    - if: '$CI_COMMIT_BRANCH'

# ==========================================
# 2. TEST STAGE
# ==========================================
code_test:
  stage: test
  tags:
    - llm
  script:
    - echo "There is no test script right now. The test script will be added in the future..."
  rules:
    - if: '$CI_COMMIT_BRANCH'

# ==========================================
# 3. DEPLOY STAGE (สั่งทำงานเฉพาะบน branch main เท่านั้น)
# ==========================================
deploy_to_server:
  stage: deploy
  image: docker:latest
  tags:
    - llm
  variables:
    # 💡 บังคับให้ docker cli วิ่งมาคุยกับ Socket ของเครื่องหลักที่เมาท์เข้าไป ไม่ต้องวิ่งไปหา tcp://docker:2375
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: "" # ปิดการใช้งาน TLS เนื่องจากคุยกันผ่าน Socket ภายในเครื่อง
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "========== 1. Build and Start Services =========="
    - docker compose up -d --build --wait

    - echo "========== 2. Smart AI Model Pull (4.7GB) =========="
    # check if qwen2.5:7b is already existing, if not then pull it.
    - |
      if docker compose exec -e http_proxy="" -e https_proxy="" -e HTTP_PROXY="" -e HTTPS_PROXY="" soc-ollama ollama list | grep -q "qwen2.5:7b"; then
        echo "AI Model (qwen2.5:7b) is already exists. Skip downloading step..."
      else
        echo "Model is not found. Downloading the model (This step might take some times.)..."
        docker compose exec -e http_proxy="" -e https_proxy="" -e HTTP_PROXY="" -e HTTPS_PROXY="" soc-ollama ollama pull qwen2.5:7b
      fi

    - echo "========== 3. Initialize/Migrate Database =========="
    # Run the database preparation script (make sure this script doesn't destructively overwrite existing data).
    - docker compose exec soc-backend python scripts/init_db.py

    - echo "========== 4. Post-Deployment Restarts =========="
    # Restart worker
    - docker compose restart soc-worker
    - echo "Application has been deployed successfully!"

deploy_dev:
  stage: deploy
  image: docker:latest
  tags:
    - llm
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
    COMPOSE_PROJECT: "soc-ai-ops-dev"
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "restructure"' #add condition to specific branch anem which want to build test container
  script:
    # - echo "========== uncomment this to force down to clear wrong init DB only (all data will be purged!)=========="
    # - docker compose -p ${COMPOSE_PROJECT} -f docker-compose-dev.yml down -v

    - echo "========== 1. Build and Start Services =========="
    - docker compose -p ${COMPOSE_PROJECT} -f docker-compose-dev.yml up -d --build

    - echo "========== 2. Initialize Database (create schema + default admin) =========="
    - docker compose -p ${COMPOSE_PROJECT} -f docker-compose-dev.yml exec soc-backend-dev python scripts/init_db.py

    - echo "Dev deployment finished!"