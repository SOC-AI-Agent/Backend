# The core backend: API, queue worker, database and Redis.
#
# The only writer to the database, and the only thing that owns job state.
#
#   cp .env.example .env
#   docker compose up -d --build
#
# Needs, over soc-network: soc-ai (the AI service), and for stage 2 a Splunk MCP
# server (soc-mcp-splunk in development, Splunk's own in production). ThreatQ and
# Confluence are called directly over the company network. It starts without any
# of them and each call that needs one fails with a message naming it, rather
# than the stack refusing to come up.

services:
  soc-db:
    image: postgres:16-alpine
    container_name: soc-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-socai}
      POSTGRES_USER: ${POSTGRES_USER:-socai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-socai_secret}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-socai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [soc-network]

  # deploy_production's database until production's is wired in (the CI
  # variable PROD_POSTGRES_PASSWORD unset). A name of its own, so it can never
  # answer for the soc-db the FastAPI-era stack runs on the production host.
  # Started only with --profile test-db.
  soc-test-db:
    profiles: [test-db]
    image: postgres:16-alpine
    container_name: soc-test-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-socai}
      POSTGRES_USER: ${POSTGRES_USER:-socai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-socai_secret}
    volumes: [test-postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-socai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [soc-network]

  soc-redis:
    image: redis:7-alpine
    # Not soc-redis: the FastAPI-era stack on the production host already has a
    # container by that name, and container names are host-wide. This one still
    # answers to soc-redis, its service name, on soc-network.
    container_name: soc-core-redis
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [soc-network]

  soc-core-api:
    build: .
    container_name: soc-core-api
    command: node dist/main.js
    environment:
      APP_ROLE: api
    # 8082, not 8081: on the production host 8081 belongs to the FastAPI-era
    # dev stack's soc-backend-dev. BACKEND_HOST_PORT moves it if 8082 is ever
    # taken too. The dashboard reaches the API over soc-network, not this port.
    ports: ["${BACKEND_HOST_PORT:-8082}:8000"]
    env_file: [.env]
    volumes:
      # The data catalogue is not mounted: it is in the image (catalog/ ->
      # /catalog, see the Dockerfile).
      # The internal CA for Splunk, ThreatQ and Confluence, named by
      # NODE_EXTRA_CA_CERTS in .env. Empty unless a PEM is put there.
      - ./certs:/certs:ro
    depends_on:
      soc-db: {condition: service_healthy}
      soc-redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks: [soc-network]

  soc-core-worker:
    build: .
    container_name: soc-core-worker
    command: node dist/main.js
    environment:
      APP_ROLE: worker
    env_file: [.env]
    volumes:
      - ./certs:/certs:ro
    depends_on:
      soc-db: {condition: service_healthy}
      soc-redis: {condition: service_healthy}
    restart: unless-stopped
    networks: [soc-network]

volumes:
  postgres-data:
  test-postgres-data:
  redis-data:

networks:
  # Shared by AI-service/Backend/Frontend/MCP-Server's stacks. Created once,
  # outside any one project (`docker network create soc-network`) — external
  # here so this project doesn't believe it owns and can tear down a network
  # the others are still using.
  soc-network:
    external: true
    name: soc-network
