# Backend — build, then deploy on main.
#
# Adapted from the monorepo's pipeline, which was written when this was one
# repo with a FastAPI backend. Four things changed and each one mattered:
#
#   python scripts/init_db.py  ->  prisma + a seed that refuses a blank password
#   soc-backend / soc-worker   ->  soc-core-api / soc-core-worker
#   postgresql+asyncpg://      ->  postgresql://          (Prisma, not SQLAlchemy)
#   one .env for everything    ->  one per repo
#
# The last one needs saying out loud: AI_SERVICE_AUTH_TOKEN must be
# byte-identical in this project and in AI-Service. Set it as a GROUP variable
# on Agentic-AI-for-Enhancing-SOC, not per project — two projects holding their
# own copy is two copies that drift, and the failure is a 401 with nothing
# saying why. Everything else is this project's alone: the backend calls
# ThreatQ (THREATQ_*), Confluence (CONFLUENCE_*) and Splunk's own MCP server
# (SPLUNK_MCP_URL, SPLUNK_MCP_TOKEN) directly — MCP-Server is development-only
# and not deployed, so MCP_AUTH_TOKEN is not needed here. SPLUNK_URL and
# SPLUNK_TOKEN are read only by the manual export_catalog job.
# PROD_POSTGRES_PASSWORD decides which database deploy_production uses: set,
# production's; unset, a test database of this project's own (its step 2).

stages:
  - build
  - test
  - inspect
  - deploy
  - verify

# The office proxy, the runner host's only way to the internet. A CI/CD
# variable of the same name overrides this; an empty one turns the proxy off.
variables:
  BUILD_PROXY: "http://192.168.137.120:8080"


# ── Reusable: write .env from CI variables ──────────────────────────────────
#
# Not sed. A password containing | or / breaks the expression, and one
# containing & is silently replaced by the matched text — the pipeline goes
# green and the service cannot log in. This reads the keys from .env.example
# and takes any that exist in the environment, whatever characters they hold.
#
# The result is never an artifact and never printed. The monorepo's job did
# both: `artifacts: paths: [.env]` put filled-in production credentials in
# GitLab's artifact store for a week, downloadable by anyone with project
# access, and `cat .env | grep -v PASSWORD | grep -v SECRET | grep -v URL`
# printed everything else — including MCP_AUTH_TOKEN, SPLUNK_TOKEN,
# THREATQ_TOKEN and CONFLUENCE_API_TOKEN, none of which contain those words.
.write_env: &write_env |
  set -eu
  : > .env
  while IFS= read -r line || [ -n "$line" ]; do
    case "$line" in
      ''|'#'*) printf '%s\n' "$line" >> .env; continue ;;
    esac
    key=${line%%=*}
    if [ "$key" = "$line" ]; then printf '%s\n' "$line" >> .env; continue; fi
    if eval "[ \"\${${key}+set}\" = set ]"; then
      eval "printf '%s=%s\n' \"\$key\" \"\$$key\"" >> .env
    else
      printf '%s\n' "$line" >> .env
    fi
  done < .env.example
  echo "wrote .env — keys taken from CI variables:"
  # Names only. The values are the point of the exercise.
  while IFS= read -r line; do
    key=${line%%=*}
    case "$key" in ''|'#'*) continue ;; esac
    if eval "[ \"\${${key}+set}\" = set ]"; then echo "  $key"; fi
  done < .env.example

# ── Reusable: the office proxy ──────────────────────────────────────────────
#
# Without it apt, npm, pip and prisma time out on the runner host ("Unable to
# locate package"). Exported for the npm/pip a job runs itself, and handed to
# `docker build` / `docker compose build` as PROXY_ARGS: a build does not
# inherit the job's environment. These are Docker's predefined proxy build
# args — no ARG line needed in any Dockerfile, and they stay out of the image's
# history. Both spellings, because apt reads only the lowercase ones. Set inside
# the script, after the checkout, so `git clone` never goes through the proxy.
.proxy: &proxy |
  p="${BUILD_PROXY:-}"
  np="localhost,127.0.0.1"
  export http_proxy="$p" https_proxy="$p" HTTP_PROXY="$p" HTTPS_PROXY="$p" \
         no_proxy="$np" NO_PROXY="$np"
  PROXY_ARGS="--build-arg http_proxy=$p --build-arg https_proxy=$p --build-arg HTTP_PROXY=$p --build-arg HTTPS_PROXY=$p --build-arg no_proxy=$np --build-arg NO_PROXY=$np"
  if [ -n "$p" ]; then echo "proxy: on"; else echo "proxy: off (BUILD_PROXY is empty)"; fi

build_image:
  stage: build
  image: docker:latest
  tags:
    - llm
  # Builds on the runner host's own Docker daemon, through the socket the llm
  # runner mounts — no docker:dind. One fixed tag, overwritten each run: the
  # host is the production machine, and an image per commit would pile up on
  # its disk.
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
  script:
    - *proxy
    - docker build $PROXY_ARGS -t soc-core:ci .
  rules:
    - if: '$CI_COMMIT_BRANCH'

code_test:
  stage: test
  image: node:20
  tags:
    - llm
  script:
    - *proxy
    - npm ci
    - npx prisma generate
    # Type errors have reached main from this repo before. tsc is not a test
    # suite, but it is the check that would have caught them.
    - npx tsc --noEmit
  rules:
    - if: '$CI_COMMIT_BRANCH'

deploy_production:
  stage: deploy
  image: docker:latest
  # The only job that needs a specific runner. DOCKER_HOST points at the
  # socket of the machine this runs on, so the runner *is* the deployment
  # target — a shared runner would build the stack inside a throwaway
  # container and take it away again.
  tags:
    # `llm` is the production runner: the one installed on the machine that
    # hosts the stack, so the runner IS the deployment target. Every job in
    # this file runs on it — a docker executor with the host's
    # /var/run/docker.sock mounted. The `test` runner is a shell executor with
    # no docker, so nothing here uses it.
    - llm
  variables:
    # The socket of the machine this runner is on: the deployment target.
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
  environment:
    name: production
    # The address GitLab shows and links to: the one step 6 found answering,
    # handed over in deploy.env.
    url: '$DYNAMIC_ENVIRONMENT_URL'
  # deploy.env holds that one URL and nothing else — never .env.
  artifacts:
    reports:
      dotenv: deploy.env
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - *write_env
    # Fixed rather than taken from the checkout directory, whose name GitLab
    # picks: step 2 tells this project's containers from another stack's by it.
    - export COMPOSE_PROJECT_NAME=backend

    - echo "========== 0. Host ports =========="
    # Before anything is built or migrated: each host port this stack
    # publishes, and which other container holds it now. `up` would say only
    # "port is already allocated", after the build and the migration; this
    # says what to set. BACKEND_HOST_PORT moves the API (the inspect_ports job
    # names a free port). If it is set and the port has not moved, either this
    # job cannot see the variable or this repo's docker-compose.yml predates it
    # — the two are told apart below.
    - |
      ports=$(docker compose config --format json | sed -n 's/.*"published": *"*\([0-9][0-9]*\).*/\1/p' | sort -u)
      echo "BACKEND_HOST_PORT in this job: ${BACKEND_HOST_PORT:-not set}"
      echo "published by this stack: $(echo $ports)"
      if [ -n "${BACKEND_HOST_PORT:-}" ] && ! printf '%s\n' $ports | grep -qx "$BACKEND_HOST_PORT"; then
        echo "BACKEND_HOST_PORT is $BACKEND_HOST_PORT, but docker-compose.yml does not publish it:"
        echo "this repo's docker-compose.yml is older than BACKEND_HOST_PORT. Copy the current one."
        exit 1
      fi
      busy=""
      for port in $ports; do
        holder=$(docker ps --filter "publish=$port" --format '{{.Names}} ({{.Label "com.docker.compose.project"}})' \
          | grep -v "($COMPOSE_PROJECT_NAME)\$" | tr '\n' ' ' || true)
        if [ -n "$holder" ]; then echo "  $port: held by $holder"; busy="$busy $port"; fi
      done
      if [ -n "$busy" ]; then
        echo "Set the CI variable BACKEND_HOST_PORT to a free port (inspect_ports names one)."
        echo "Already set? Then this job cannot see it: Protected while main is not a"
        echo "protected branch, or an environment scope other than All or production."
        exit 1
      fi
      echo "  all free (or this stack's own)"

    - echo "========== 1. Build =========="
    # soc-network is external (see docker-compose.yml) — shared with
    # AI-service/Frontend/MCP-Server's deploys, all on this same production
    # runner/host. Whichever of the four deploys first, creates it; idempotent
    # so the other three deploying in any order or any number of times is fine.
    - docker network create soc-network 2>/dev/null || true
    - *proxy
    - docker compose build $PROXY_ARGS

    - echo "========== 2. Database and Redis =========="
    # Which database, chosen by the CI variable PROD_POSTGRES_PASSWORD:
    #
    #   unset  test: soc-test-db, this project's own (volume
    #          backend_test-postgres-data), created empty with POSTGRES_USER /
    #          POSTGRES_PASSWORD / POSTGRES_DB on the first deploy and kept
    #          after. Production's soc-db is not touched at all: not attached,
    #          not backed up, not migrated.
    #   set    production: the soc-db the FastAPI-era stack already runs on this
    #          host (compose project soc-ai-ops, volume soc-ai-ops_postgres-data),
    #          with the data in it, as PROD_POSTGRES_USER on PROD_POSTGRES_DB
    #          (both default to socai) — the names the monorepo's pipeline
    #          used. Used as it is: started if stopped and attached to
    #          soc-network; nothing here recreates or removes it. soc-test-db is
    #          stopped, its rows left where they are; nothing moves across.
    #
    # Going to production is setting PROD_POSTGRES_PASSWORD and deploying
    # again; deleting it goes back to the test database.
    #
    # CORE_DATABASE_URL is written into .env here, from those variables — a
    # CORE_DATABASE_URL CI variable is not used — with the password
    # percent-encoded byte by byte so any character survives the URL. Never
    # printed.
    #
    # Redis is this project's own in both: soc-core-redis (see
    # docker-compose.yml), named outright in REDIS_URL, because the old stack's
    # soc-redis is left alone and may answer to the name soc-redis too.
    - |
      pct() { printf '%s' "$1" | od -An -v -tx1 | tr -d ' \n' | sed 's/../%&/g'; }
      dotenv() { sed -n "s/^$1=//p" .env | head -n 1; }
      if [ -n "${PROD_POSTGRES_PASSWORD:-}" ]; then
        db=production
        if ! docker container inspect soc-db >/dev/null 2>&1; then
          echo "PROD_POSTGRES_PASSWORD is set, but this host has no soc-db container."
          echo "Delete the variable to deploy against the test database instead."
          exit 1
        fi
        project=$(docker container inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' soc-db)
        echo "database: production — soc-db (compose project: ${project:-none})"
        if [ "$(docker container inspect -f '{{.State.Running}}' soc-db)" != true ]; then
          echo "  stopped — starting it"
          docker start soc-db >/dev/null
        fi
        if [ -z "$(docker container inspect -f '{{if index .NetworkSettings.Networks "soc-network"}}yes{{end}}' soc-db)" ]; then
          echo "  attaching it to soc-network"
          docker network connect soc-network soc-db
        fi
        # By its own healthcheck if it has one. Not a gate: whether the
        # password gets in is what step 3 finds out, with a clearer error.
        for i in $(seq 1 30); do
          state=$(docker container inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' soc-db)
          case "$state" in healthy|running) break ;; esac
          sleep 2
        done
        echo "  $state"
        docker compose --profile test-db stop soc-test-db
        url="postgresql://${PROD_POSTGRES_USER:-socai}:$(pct "$PROD_POSTGRES_PASSWORD")@soc-db:5432/${PROD_POSTGRES_DB:-socai}"
      else
        db=test
        # The volume keeps the password it is created with, so a real one,
        # not .env.example's.
        : "${POSTGRES_PASSWORD:?set the CI variable POSTGRES_PASSWORD — the test database is created with it}"
        echo "database: test — soc-test-db (PROD_POSTGRES_PASSWORD is not set)"
        docker compose --profile test-db up -d --wait soc-test-db
        user=$(dotenv POSTGRES_USER); name=$(dotenv POSTGRES_DB)
        url="postgresql://${user:-socai}:$(pct "$(dotenv POSTGRES_PASSWORD)")@soc-test-db:5432/${name:-socai}"
      fi
      docker compose up -d --wait soc-redis
      # Confluence Cloud is on the internet, which this host reaches only
      # through the office proxy: the same BUILD_PROXY the builds use, for the
      # Confluence calls alone. A CONFLUENCE_PROXY CI variable wins, an empty
      # one included (no proxy). Server/DC inside the network: direct.
      cproxy=$(dotenv CONFLUENCE_PROXY)
      case "$(dotenv CONFLUENCE_BASE_URL)" in
        *.atlassian.net*) [ -n "${CONFLUENCE_PROXY+set}" ] || cproxy="${BUILD_PROXY:-}" ;;
      esac
      { grep -v -E '^(CORE_DATABASE_URL|REDIS_URL|REDIS_HOST|CONFLUENCE_PROXY)=' .env
        printf 'CORE_DATABASE_URL=%s\n' "$url"
        printf 'REDIS_URL=redis://soc-core-redis:6379/0\nREDIS_HOST=soc-core-redis\n'
        printf 'CONFLUENCE_PROXY=%s\n' "$cproxy"
      } > .env.new
      mv .env.new .env

    - echo "========== 3. Backup, schema and roles =========="
    # Production only: a dump before anything below touches its database, on
    # every deploy. The first one alters a database that has never been
    # migrated, and nobody can reach this host to take one by hand. Kept in the
    # volume backend_db-backups, newest 10 — never an artifact, it is
    # production data. Restore the newest the same way:
    #   docker run --rm --network soc-network -v backend_db-backups:/backup \
    #     --env-file .env postgres:16-alpine sh -c 'pg_restore --clean \
    #     --if-exists -d "${CORE_DATABASE_URL%%\?*}" "$(ls -1t /backup/*.dump | head -1)"'
    #
    # Written as .part and renamed only once pg_dump succeeds: a failed one
    # (wrong password) leaves an empty file, and empty files counted among the
    # newest 10 would push the real ones out.
    - |
      if [ "$db" = production ]; then
        docker run --rm --network soc-network -v backend_db-backups:/backup --env-file .env \
          postgres:16-alpine sh -c '
            set -e
            rm -f /backup/*.part
            f=/backup/$(date -u +%Y%m%dT%H%M%SZ).dump
            if ! pg_dump -Fc -f "$f.part" "${CORE_DATABASE_URL%%\?*}"; then rm -f "$f.part"; exit 1; fi
            mv "$f.part" "$f"
            ls -1t /backup/*.dump | tail -n +11 | xargs -r rm -f
            echo "backup: $f ($(du -h "$f" | cut -f1))"'
      else
        echo "backup: skipped — test database"
      fi
    # Before the API and the worker start, so neither runs against a schema it
    # does not expect. scripts/migrate.sh applies prisma/migrations, baselines
    # the FastAPI-era database the first time (tables, no migration history),
    # and stops the deploy if the database then differs from schema.prisma. In
    # one-off containers of the image just built; --no-deps because step 2 has
    # settled where the database and Redis are, and depends_on names this
    # project's own.
    #
    # `db push` is deliberately NOT run here. It makes the database match the
    # schema file, and on production that includes dropping a column the schema
    # no longer mentions — without asking, and with the data in it.
    - docker compose run --rm --no-deps -T soc-core-api sh scripts/migrate.sh
    # Roles only. Production users are provisioned separately; no credential
    # is created from the environment.
    - docker compose run --rm --no-deps -T soc-core-api node dist/seed.js

    - echo "========== 4. Start =========="
    - |
      if ! docker compose up -d --wait --no-deps soc-core-api soc-core-worker; then
        docker compose logs --tail 50 soc-core-api soc-core-worker
        exit 1
      fi

    - echo "========== 5. Health =========="
    # A deploy that finishes is not a deploy that works. Checked here so the
    # pipeline goes red rather than green-and-broken.
    - |
      healthy=""
      for i in $(seq 1 30); do
        if docker compose exec -T soc-core-api curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
          healthy=yes; break
        fi
        sleep 4
      done
      if [ -z "$healthy" ]; then
        echo "the API did not become healthy within 2 minutes"
        docker compose logs --tail 50 soc-core-api
        exit 1
      fi
      echo "healthy inside the container"

    - echo "========== 6. Address =========="
    # Where the API answers from outside: what to give SOAR, and to open in a
    # browser — asked for /health the way they will ask, at this host's address
    # and the published port, so a port that is published but not reachable
    # fails here too.
    #
    # The port is what Docker published for soc-core-api. The IP is the one
    # this host sends from on its default route, read from a throwaway
    # container on the host's network (this job's own container has another);
    # the CI variable DEPLOY_HOST overrides it — a DNS name, or the address of
    # another interface. Both throwaway containers are this job's image.
    - |
      port=$(docker compose port soc-core-api 8000 | sed -n '1s/.*://p')
      host="${DEPLOY_HOST:-}"
      if [ -z "$host" ]; then
        host=$(docker run --rm --network host --entrypoint sh "$CI_JOB_IMAGE" -c '
          { ip route get 1.1.1.1 2>/dev/null | sed -n "s/.* src \([0-9.]*\).*/\1/p"
            ip -4 -o addr show scope global | grep -v -E " (docker0|br-|veth)" | sed -n "s/.* inet \([0-9.]*\).*/\1/p"
          } | head -n 1')
      fi
      url="http://$host:$port"
      echo "Backend API  $url"
      echo "  health     $url/health"
      echo "  docs       $url/docs"
      echo "  SOAR       POST $url/v1/analyze"
      if ! answer=$(docker run --rm --network host --entrypoint wget "$CI_JOB_IMAGE" -qO- -T 10 "$url/health"); then
        echo "$url/health does not answer, though the API is healthy inside its container:"
        echo "the port is published but not reachable at this address. Set DEPLOY_HOST if"
        echo "clients reach this host by another name or interface."
        exit 1
      fi
      echo "  answers    $answer"
      echo "DYNAMIC_ENVIRONMENT_URL=$url/docs" > deploy.env

    - echo "========== 7. Splunk connection =========="
    # From the worker just started, with its SPLUNK_MCP_URL: first the network
    # with the certificate NOT checked (does the name resolve, does the port
    # answer, what does the endpoint say), then the certificate itself (who
    # issued it, which names it covers, whether the worker trusts it with
    # NODE_EXTRA_CA_CERTS). Unchecked is safe here because no token is sent.
    # So a network that works is told apart from a CA that is missing, and the
    # CA to ask for is named. scripts/splunk-probe.sh. A report only: Splunk
    # not answering never fails the deploy — check_splunk, after it, goes on to
    # the token and the tools.
    #
    # When the worker cannot get through, the same probe again from this
    # server's own network (same image, same .env, outside Docker), to say who
    # has to open what: blocked there too is the network between this server
    # and Splunk; open there is this server's own forwarding for containers.
    - |
      if ! out=$(docker exec -i soc-core-worker sh -s < scripts/splunk-probe.sh 2>&1); then
        out="(the probe could not run; the deploy itself is done)"
      fi
      echo "$out"
      case "$out" in *"NOT reached"*)
        echo "--- the same from this server itself, outside Docker:"
        host_out=$(docker run --rm -i --network host --env-file .env --entrypoint sh \
          "$(docker inspect -f '{{.Config.Image}}' soc-core-worker)" -s < scripts/splunk-probe.sh 2>&1) || host_out=""
        printf '%s\n' "$host_out" | awk '/^network/ { p = 1 } /^(certificate|trusted)/ { p = 0 } p'
        case "$host_out" in
          *"NOT reached"*)
            echo "=> blocked outside this server too: the network team has to allow ${host:-this server}"
            echo "   to the address and port above (or to port 8089, if that one is named instead)" ;;
          *"network      reached"*)
            echo "=> this server gets through, its containers do not: Docker's forwarding on this"
            echo "   server (firewalld) — for the server's admin, not the network team" ;;
          *) echo "(the check from the server itself could not run)" ;;
        esac ;;
      esac

# Prints the production database's tables, columns, enums, constraints,
# indexes, Prisma migration history, and its drift from the deployed
# prisma/schema.prisma — the inventory prisma/migrations/0_init was written
# from — and the containers, volumes and networks beside it.
# Read-only (see scripts/inspect-db-schema.sh); structure only, no rows and no
# credentials reach the log.
#
# On main it runs by itself, in its own stage before deploy_production, so
# the database is shown as it was before this deploy — and
# is shown even when the deploy then fails. The drift section compares against
# the backend deployed last time, if one is running on this database. allow_failure: a host with
# no database yet fails the inspection, and that must not stop the deploy that
# creates it. On other protected branches it stays a button (▶).
inspect_db_schema:
  stage: inspect
  image: docker:latest
  # Same runner as deploy_production: the machine whose soc-db this reads.
  tags:
    - llm
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
  # Reads production without deploying to it; whoever may deploy to the
  # protected "production" environment is who may run this.
  environment:
    name: production
    action: access
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      allow_failure: true
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
  script:
    - sh scripts/inspect-db-schema.sh

# Which host ports the stack publishes on this machine, and what holds each one:
# a running container, a stopped one that takes the port back when it starts,
# or something that is not a container. Read-only (scripts/inspect-ports.sh),
# for choosing SERVER_HOST_PORT (Agent-Server) and FRONTEND_HOST_PORT
# (Frontend) before a deploy finds one taken. Add ports for one run with the
# CI variable CHECK_PORTS="9000 9001".
#
# Right after inspect_db_schema, with the same rules. needs still lets this run
# when that one fails (allow_failure), and it never stops a pipeline either.
inspect_ports:
  stage: inspect
  image: docker:latest
  tags:
    - llm
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
  environment:
    name: production
    action: access
  needs: [inspect_db_schema]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      allow_failure: true
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
  script:
    - sh scripts/inspect-ports.sh

# Can stage 2 reach Splunk? Two jobs, one script, both in the deployed
# soc-core-worker — the container that does the lookups, with its .env,
# network and CA:
#   1. network and certificate: curl to SPLUNK_MCP_URL with the same CA, no
#      token — "HTTP 401" is the answer wanted; anything else names what is
#      wrong (DNS, a firewall timing out, the certificate) more plainly than
#      Node's "fetch failed"
#   2. scripts/splunk-mcp-check: the token, whether the CA file is really
#      there, and whether Splunk's MCP server offers saia_generate_spl and
#      splunk_run_query
#   3. check_splunk_requirement only: the requirement in
#      SPLUNK_CHECK_REQUIREMENT, end to end — Text-to-SPL, the guard, the
#      search — printing the prompt, the SPL that ran and the rows
#
# check_splunk runs by itself on main right after deploy_production (a button
# on other protected branches). check_splunk_requirement is always a button:
# a search against production Splunk on demand, not on every deploy. It is a
# job of its own because GitLab offers the "Run job" form, where the
# requirement is typed in, only for a manual job.
#
# Read-only; the token is never printed. See docs/splunk-mcp.md, section 5.
#
# A Splunk that does not answer must not take the rest down with it: both are
# allowed to fail. A failure shows as ⚠ with the reason in the log, while the
# pipeline, and the deploy before it, stay passed — Splunk is only stage 2, and
# the rest of the system works without it.
.splunk_check:
  stage: verify
  image: docker:latest
  tags:
    - llm
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
  environment:
    name: production
    action: access
  # After the deploy on main, so it checks what was just deployed. Elsewhere
  # there is no deploy in the pipeline; it checks the one already running.
  needs:
    - job: deploy_production
      optional: true
  script:
    # What is deployed, before checking what it can reach: when the worker
    # was made, and whether the Splunk settings reached it. A variable this
    # job sees but the worker does not was set after the last deploy (or the
    # deploy did not finish); one this job does not see is not set, or is
    # hidden from main (Protected on an unprotected branch, or an environment
    # scope other than All/production). The token's value is never printed.
    - |
      echo "== 0. The deployed worker =="
      docker inspect -f 'container created {{.Created}}' soc-core-worker
      docker image inspect -f 'image built       {{.Created}}' "$(docker inspect -f '{{.Image}}' soc-core-worker)"
      echo "SPLUNK_MCP_URL    this job: ${SPLUNK_MCP_URL:-NOT SET}"
      echo "                  worker:   $(docker exec soc-core-worker printenv SPLUNK_MCP_URL || echo 'NOT SET')"
      if [ -n "${SPLUNK_MCP_TOKEN:-}" ]; then t=set; else t="NOT SET"; fi
      echo "SPLUNK_MCP_TOKEN  this job: $t"
      echo "                  worker:   $(docker exec soc-core-worker sh -c '[ -n "${SPLUNK_MCP_TOKEN:-}" ] && echo set || echo "NOT SET"')"
      if ! docker exec soc-core-worker test -f dist/scripts/splunk-mcp-check.js; then
        echo "This worker was built from code without stage 2 over MCP (no dist/scripts/splunk-mcp-check.js):"
        echo "the current code has not been deployed. See deploy_production's log in this pipeline."
        exit 1
      fi
    - |
      echo "== 1. Network and certificate (no token sent: HTTP 401 means both are fine) =="
      docker exec soc-core-worker sh -c '
        [ -n "${SPLUNK_MCP_URL:-}" ] || { echo "SPLUNK_MCP_URL is not set"; exit 0; }
        ca=/etc/ssl/certs/ca-certificates.crt
        if [ -n "${NODE_EXTRA_CA_CERTS:-}" ]; then
          if [ -r "$NODE_EXTRA_CA_CERTS" ]; then
            cat "$ca" "$NODE_EXTRA_CA_CERTS" > /tmp/ca-check.pem && ca=/tmp/ca-check.pem
          else
            echo "NODE_EXTRA_CA_CERTS=$NODE_EXTRA_CA_CERTS is not in the container (production: /app/certs/...)"
          fi
        fi
        curl -sS -o /dev/null -w "HTTP %{http_code}\n" --max-time 20 --cacert "$ca" "$SPLUNK_MCP_URL" || true'
      echo "== 2. MCP: token, CA and tools${SPLUNK_CHECK_REQUIREMENT:+ — 3. one requirement end to end} =="
      docker exec soc-core-worker node dist/scripts/splunk-mcp-check.js "${SPLUNK_CHECK_REQUIREMENT:-}"

check_splunk:
  extends: .splunk_check
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      allow_failure: true
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
  # A project-level SPLUNK_CHECK_REQUIREMENT would make every deploy search
  # production Splunk; that is check_splunk_requirement's job.
  before_script:
    - unset SPLUNK_CHECK_REQUIREMENT

# Press ▶ and, in the "Run job" form, set SPLUNK_CHECK_REQUIREMENT, e.g.
# "Which destinations did 10.1.100.11 talk to".
check_splunk_requirement:
  extends: .splunk_check
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
  before_script:
    - |
      if [ -z "${SPLUNK_CHECK_REQUIREMENT:-}" ]; then
        echo "Set SPLUNK_CHECK_REQUIREMENT in this job's Run job form (the ▶ button), e.g."
        echo "  Which destinations did 10.1.100.11 talk to"
        exit 1
      fi

# Can the worker read the playbook space in Confluence? In the deployed
# soc-core-worker, with its .env, network, CONFLUENCE_PROXY and CA:
#   0. the worker, and whether the Confluence settings reached it (the token as
#      set / NOT SET only, a proxy without its password)
#   1. scripts/confluence-check: the whole space read the way the hourly sync
#      reads it — same API (v2 for Cloud, v1 for Server/DC), credentials, proxy
#      and paging — and how many pages that came to; a failure says what it
#      means (DNS, firewall, proxy, certificate, 401/403/404)
#   2. the worker's own last sync results from its log: whether soc-ai indexed
#      them, and how many playbooks that made
# Runs by itself on main right after deploy_production, a button elsewhere.
# Read-only; nothing is sent to soc-ai or written to Confluence. Allowed to
# fail, like check_splunk: ⚠ with the reason, the pipeline still passed.
check_confluence:
  stage: verify
  image: docker:latest
  tags:
    - llm
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
  environment:
    name: production
    action: access
  needs:
    - job: deploy_production
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      allow_failure: true
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
  script:
    - |
      echo "== 0. The deployed worker =="
      docker inspect -f 'container created {{.Created}}' soc-core-worker
      docker exec soc-core-worker sh -c '
        for k in CONFLUENCE_BASE_URL CONFLUENCE_SPACE_KEY CONFLUENCE_EMAIL CONFLUENCE_API CONFLUENCE_PROXY; do
          eval "v=\${$k:-}"
          [ "$k" = CONFLUENCE_PROXY ] && v=${v#*@}
          printf "%-21s %s\n" "$k" "${v:-NOT SET}"
        done
        [ -n "${CONFLUENCE_API_TOKEN:-}" ] && t=set || t="NOT SET"
        printf "%-21s %s\n" CONFLUENCE_API_TOKEN "$t"'
      if ! docker exec soc-core-worker test -f dist/scripts/confluence-check.js; then
        echo "This worker was built from code without dist/scripts/confluence-check.js:"
        echo "the current code has not been deployed. See deploy_production's log in this pipeline."
        exit 1
      fi
    - echo "== 1. Reading the space, as the sync does =="
    - docker exec soc-core-worker node dist/scripts/confluence-check.js
    - |
      echo "== 2. The worker's last syncs (its log) =="
      docker logs soc-core-worker 2>&1 \
        | grep -E 'playbooks synced|playbook sync failed|playbooks are not synced' | tail -n 3 \
        || echo "(none yet: the first sync starts when the worker does)"

# ── Splunk data catalogue ────────────────────────────────────────────────────
#
# Reads Splunk and writes down what stage 1 needs to aim a requirement: which
# indexes and sourcetypes exist and which fields each one carries. Never runs on
# its own — press ▶ on it. It runs one search per sourcetype against a
# production search head, and the catalogue changes when the estate does, not
# per commit.
#
# Leaves an artifact, not a commit. catalog/table/ holds the raw export (field
# names and up to three example values per field, from real events) and
# catalog/table/splunk-catalog.json: the committed catalogue with the export
# merged in — new sourcetypes marked TODO, guessed roles listed under
# _review_roles, nothing anyone wrote overwritten. A person reads it, copies what
# is right into catalog/splunk-catalog.json and commits; the next deploy builds
# it into the image. See docs/splunk-catalog.md.
#
# Needs SPLUNK_URL (the management port, https://<search-head>:8089) and
# SPLUNK_TOKEN as protected, masked CI variables. SPLUNK_TOKEN is an ordinary
# Splunk authentication token for the backend's search-only service account —
# the encrypted MCP token does not work outside MCP. The certificate is
# verified; for an internal CA, put it in certs/ and set the CI variable
# SSL_CERT_FILE=certs/<file>.pem.
export_catalog:
  # Beside check_splunk and check_splunk_requirement: the Splunk jobs together.
  stage: verify
  image: python:3.12
  # Needs to reach Splunk's management port, which a shared runner cannot.
  tags:
    - llm
  # Reads production; whoever may deploy to it is who may run this.
  environment:
    name: production
    action: access
  # Talks to Splunk's REST API, not to anything deployed here: nothing to wait
  # for, so the button is there as soon as the pipeline starts.
  needs: []
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
  script:
    - |
      set -eu
      : "${SPLUNK_URL:?set the CI variable SPLUNK_URL, e.g. https://splunk.internal:8089}"
      : "${SPLUNK_TOKEN:?set the CI variable SPLUNK_TOKEN}"

      # Into a staging directory, checked, and only then moved into place. An
      # export that died partway is worse than none: a catalogue listing three of
      # two hundred sourcetypes reads as a small estate, not a broken export.
      SPLUNK_AUTH="Bearer $SPLUNK_TOKEN" SPLUNK_INSECURE=0 \
      OUT="$CI_PROJECT_DIR/catalog-staging" \
        python3 scripts/export_splunk_catalog.py
      python3 scripts/verify_catalog_export.py "$CI_PROJECT_DIR/catalog-staging"
      rm -rf catalog/table
      mv "$CI_PROJECT_DIR/catalog-staging" catalog/table

      # The committed catalogue with the export merged in, for review.
      cp catalog/splunk-catalog.json catalog/table/splunk-catalog.json
      python3 scripts/make_catalog_template.py catalog/table -o catalog/table/splunk-catalog.json
  artifacts:
    name: "splunk-catalog-${CI_COMMIT_SHORT_SHA}"
    # Example values from real events: kept long enough to review, no longer.
    expire_in: 7 days
    paths:
      - catalog/table/
