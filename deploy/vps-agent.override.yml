# VPS override for Agent-Server.
#
# Default mode: uses external OpenAI-compatible LLM API (LLM_BASE_URL + LLM_API_KEY)
# with multiple selectable models registered in Agent-Server.
#
# dall-m-model-preload and dall-m-llamacpp are kept under `profiles: [local-llm]`
# (preserving the 8 vCPU / 32 GB RAM tuning flags and mem_limit: 10g) and are NOT
# started unless `--profile local-llm` is explicitly passed.
#
# Usage:
#   cd Agent-Server
#   docker compose -f docker-compose.yml -f ../Backend/deploy/vps-agent.override.yml up -d --build

services:
  dall-m-db:
    ports: !override
      - "127.0.0.1:5497:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dall-m-db} -d ${DB_NAME:-dall-m-db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dall-m-server:
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
    depends_on: !override
      dall-m-db:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dall-m-frontend:
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dall-m-model-preload:
    profiles: [local-llm]

  dall-m-llamacpp:
    profiles: [local-llm]
    # Kept tuned for 8 vCPU / 32 GB RAM CPU-only inference (not started unless --profile local-llm):
    command:
      - exec /app/llama-server -hf "$$(cat /models/served-model)" --offline --no-mmproj --host 0.0.0.0 --port 8080 --threads 6 --threads-batch 8 --ctx-size 8192 --parallel 1 --batch-size 512 --ubatch-size 256
    mem_limit: 10g
    cpus: 6.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
