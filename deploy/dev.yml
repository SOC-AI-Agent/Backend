# The stack you can run on a laptop.
#
#   ./deploy/dev-setup.sh                          once
#   docker compose -f deploy/dev.yml --project-directory . up -d --build
#
# Expects the repos checked out side by side:
#
#   Backend/   <- you are here
#   AI-Service/  Frontend/  MCP-Server/
#
# Set REPOS if they live elsewhere; every path goes through it — relative to
# this directory (Backend/), because of --project-directory . above. Without
# that flag, Compose resolves every relative path (REPOS's own default
# included) against the directory this file is IN (deploy/), not the one you
# ran the command from, and every ${REPOS:-..}/AI-Service/... below quietly
# becomes Backend/AI-Service/... instead of AI-Service/'s real, sibling path —
# missing one level up, and the first symptom is env_file: file not found.
#
# The three MCP connectors are not here. They refuse to start without real
# Splunk, ThreatQ and Confluence credentials, and that refusal is the point —
# one that started without them would answer confidently about data it cannot
# reach. deploy/stack.yml is the version with everything, for a machine that
# has those platforms.
#
# What works without them: an alert arrives, its indicators are extracted, the
# agent writes a suggestion, and the searches it asks for wait on the job.
#
# The agent platform (Agent-Server, ../Agent-Server) is not here either, on
# purpose: it is its own stack, own Postgres, own compose, own network — not
# soc-network — the same way Splunk/ThreatQ/Confluence are external. Bring it
# up separately (`cd ../Agent-Server && docker compose up -d --build`, defaults
# work as they are) and point soc-ai at it — AI-Service/.env.example's
# LLM_SERVER_URL default, host.docker.internal, already assumes it runs on
# this same machine.

services:
  soc-db:
    image: postgres:16-alpine
    container_name: soc-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-socai}
      POSTGRES_USER: ${POSTGRES_USER:-socai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run deploy/dev-setup.sh first}
    volumes: [dev-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-socai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [soc-network]

  soc-redis:
    image: redis:7-alpine
    container_name: soc-redis
    volumes: [dev-redis:/data]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10}
    networks: [soc-network]

  soc-ai:
    build: ${REPOS:-..}/AI-Service
    container_name: soc-ai
    # No ports: only the backend calls it, over soc-network, with a token.
    env_file: ["${REPOS:-..}/AI-Service/.env"]
    # The playbook index, so a restart does not embed every page again.
    volumes: [dev-playbook-index:/data]
    # Lets LLM_SERVER_URL=http://host.docker.internal:8000 (AI-Service/.env's
    # default) reach Agent-Server's published port when it runs, via its own
    # compose, on this same machine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [soc-network]

  soc-core-api:
    build: ${REPOS:-..}/Backend
    container_name: soc-core-api
    command: node dist/main.js
    environment: {APP_ROLE: api}
    ports: ["8081:8000"]
    env_file: ["${REPOS:-..}/Backend/.env"]
    volumes: ["${REPOS:-..}/MCP-Server/Splunk/catalog:/catalog:ro"]
    depends_on:
      soc-db: {condition: service_healthy}
      soc-redis: {condition: service_healthy}
    networks: [soc-network]

  soc-core-worker:
    build: ${REPOS:-..}/Backend
    container_name: soc-core-worker
    command: node dist/main.js
    environment: {APP_ROLE: worker}
    env_file: ["${REPOS:-..}/Backend/.env"]
    volumes: ["${REPOS:-..}/MCP-Server/Splunk/catalog:/catalog:ro"]
    depends_on:
      soc-db: {condition: service_healthy}
      soc-redis: {condition: service_healthy}
    networks: [soc-network]

  soc-frontend:
    build: ${REPOS:-..}/Frontend
    container_name: soc-frontend
    ports: ["3001:80"]
    depends_on: [soc-core-api]
    networks: [soc-network]

volumes:
  # Named dev-* so tearing the development stack down with `down -v` cannot
  # reach a production volume that happens to share this machine.
  dev-postgres:
  dev-redis:
  dev-playbook-index:

networks:
  soc-network:
    name: soc-network
    driver: bridge
