# The whole SOC-AI stack, from four repos.
#
# Each repo runs on its own with its own compose file; this is for bringing all
# of them up together on one machine. It expects the others checked out beside
# this one:
#
#   Backend/          <- you are here
#   AI-Service/
#   Frontend/
#   MCP-Server/       optional — only for the Splunk mock, see soc-mcp-splunk below
#
#   cd Backend
#   docker compose -f deploy/stack.yml --project-directory . up -d --build
#
# Set REPOS to a different parent if they live elsewhere — relative to this
# directory (Backend/), because of --project-directory . above. Without that
# flag, Compose resolves every relative path (REPOS's own default included)
# against the directory this file is IN (deploy/), not the one you ran the
# command from, and every ${REPOS:-..}/AI-Service/... below quietly becomes
# Backend/AI-Service/... instead of AI-Service/'s real, sibling path — missing
# one level up, and the first symptom is env_file: file not found.
#
# The agent platform (Agent-Server, ../Agent-Server) is not brought up by this
# file: it is its own stack — own Postgres, own compose, own network, not
# soc-network — the same way Splunk/ThreatQ/Confluence are external. Bring it
# up on its own (`cd ../Agent-Server && docker compose up -d --build`) and
# point soc-ai at it via AI-Service/.env's LLM_SERVER_URL.

services:
  # ── Data ────────────────────────────────────────────────────────────────
  soc-db:
    image: postgres:16-alpine
    container_name: soc-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-socai}
      POSTGRES_USER: ${POSTGRES_USER:-socai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-socai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [soc-network]

  soc-redis:
    image: redis:7-alpine
    container_name: soc-redis
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 5}
    restart: unless-stopped
    networks: [soc-network]

  # ── Core ────────────────────────────────────────────────────────────────
  soc-core-api:
    build: ${REPOS:-..}/Backend
    container_name: soc-core-api
    command: node dist/main.js
    environment: {APP_ROLE: api}
    ports: ["8082:8000"]
    env_file: ["${REPOS:-..}/Backend/.env"]
    volumes: ["./certs:/certs:ro"]
    depends_on:
      soc-db: {condition: service_healthy}
      soc-redis: {condition: service_healthy}
    restart: unless-stopped
    networks: [soc-network]

  soc-core-worker:
    build: ${REPOS:-..}/Backend
    container_name: soc-core-worker
    command: node dist/main.js
    environment: {APP_ROLE: worker}
    env_file: ["${REPOS:-..}/Backend/.env"]
    volumes: ["./certs:/certs:ro"]
    depends_on:
      soc-db: {condition: service_healthy}
      soc-redis: {condition: service_healthy}
    restart: unless-stopped
    networks: [soc-network]

  soc-qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: soc-qdrant
    volumes: [qdrant-data:/qdrant/storage]
    restart: unless-stopped
    networks: [soc-network]

  # ── Agent platform ──────────────────────────────────────────────────────
  # Agent-Server itself is not a service here — see the note at the top of
  # this file. soc-ai is the thing on soc-network that calls it.
  soc-ai:
    build: ${REPOS:-..}/AI-Service
    container_name: soc-ai
    # No ports: only the backend calls it, over soc-network, with a token.
    env_file: ["${REPOS:-..}/AI-Service/.env"]
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://soc-qdrant:6333}
    # The playbook index, so a restart does not embed every page again.
    volumes: [playbook-index:/data]
    # Lets LLM_SERVER_URL=http://host.docker.internal:8001 (AI-Service/.env's
    # default) reach Agent-Server's published port when it runs, via its own
    # compose, on this same machine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [soc-qdrant]
    restart: unless-stopped
    networks: [soc-network]

  # ── Splunk connector, mock (optional, development only) ──────────────────
  # Off unless asked for, so nothing here reads MCP-Server/ without it:
  #
  #   docker compose -f deploy/stack.yml --project-directory . --profile mock-splunk up -d --build
  #
  # With the profile it builds from the MCP-Server repo beside this one and
  # answers stage 2 from made-up events. Its token is MCP_AUTH_TOKEN from
  # Backend/.env (read through --project-directory .), so it needs no
  # MCP-Server/.env and cannot drift from what the backend sends. A real Splunk
  # goes through the same connector in live mode: leave the profile off and
  # bring it up from the MCP-Server repo with its own compose and .env, which
  # hold Splunk's URL and token (MCP-Server/README.md; a Splunk container to
  # try it on is in MCP-Server/external/splunk). ThreatQ and Confluence have
  # no service here: the backend calls them directly.
  soc-mcp-splunk:
    profiles: [mock-splunk]
    build: ${REPOS:-..}/MCP-Server/Splunk
    container_name: soc-mcp-splunk
    environment:
      SPLUNK_MODE: mock
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
    restart: unless-stopped
    networks: [soc-network]

  # ── Dashboard ───────────────────────────────────────────────────────────
  soc-frontend:
    build: ${REPOS:-..}/Frontend
    container_name: soc-frontend
    ports: ["3002:80"]
    depends_on: [soc-core-api]
    restart: unless-stopped
    networks: [soc-network]

volumes:
  postgres-data:
  redis-data:
  playbook-index:
  qdrant-data:

networks:
  soc-network:
    name: soc-network
    driver: bridge
