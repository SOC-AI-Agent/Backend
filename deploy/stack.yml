# The whole SOC-AI stack, from five repos.
#
# Each repo runs on its own with its own compose file; this is for bringing all
# of them up together on one machine. It expects the others checked out beside
# this one:
#
#   Backend/          <- you are here
#   AI-Service/
#   Frontend/
#   LLM-Server/
#   MCP-Server/
#
#   cd Backend
#   docker compose -f deploy/stack.yml up -d --build
#
# Set REPOS to a different parent if they live elsewhere. Every path below goes
# through it, so there is one thing to change rather than nine.

services:
  # ── Data ────────────────────────────────────────────────────────────────
  soc-db:
    image: postgres:16-alpine
    container_name: soc-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-socai}
      POSTGRES_USER: ${POSTGRES_USER:-socai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-socai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [soc-network]

  soc-redis:
    image: redis:7-alpine
    container_name: soc-redis
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 5}
    restart: unless-stopped
    networks: [soc-network]

  # One resident copy of each model, shared by every agent, so an agent run
  # does not pay a load per turn.
  soc-ollama:
    image: ollama/ollama:latest
    container_name: soc-ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=-1
    volumes: [ollama-data:/root/.ollama]
    # Below the Docker VM's own memory, or it limits nothing: a limit larger
    # than the VM reads as a setting and is not one, and the model swaps
    # instead. Measured at 0.14 tok/s while swapping against 12.93 with room.
    mem_limit: 7g
    restart: unless-stopped
    networks: [soc-network]

  # ── Core ────────────────────────────────────────────────────────────────
  soc-core-api:
    build: ${REPOS:-..}/Backend
    container_name: soc-core-api
    command: node dist/main.js
    environment: {APP_ROLE: api}
    ports: ["8081:8000"]
    env_file: [../.env]
    volumes: ["${REPOS:-..}/MCP-Server/Splunk/catalog:/catalog:ro"]
    depends_on:
      soc-db: {condition: service_healthy}
      soc-redis: {condition: service_healthy}
    restart: unless-stopped
    networks: [soc-network]

  soc-core-worker:
    build: ${REPOS:-..}/Backend
    container_name: soc-core-worker
    command: node dist/main.js
    environment: {APP_ROLE: worker}
    env_file: [../.env]
    volumes: ["${REPOS:-..}/MCP-Server/Splunk/catalog:/catalog:ro"]
    depends_on:
      soc-db: {condition: service_healthy}
      soc-redis: {condition: service_healthy}
    restart: unless-stopped
    networks: [soc-network]

  # ── Agent platform ──────────────────────────────────────────────────────
  soc-llm-server:
    build: ${REPOS:-..}/LLM-Server
    container_name: soc-llm-server
    ports: ["8400:8400"]
    env_file: ["${REPOS:-..}/LLM-Server/.env"]
    volumes: [llm-agents:/data]
    depends_on: [soc-ollama]
    restart: unless-stopped
    networks: [soc-network]

  soc-ai:
    build: ${REPOS:-..}/AI-Service
    container_name: soc-ai
    # No ports: only the backend calls it, over soc-network, with a token.
    env_file: ["${REPOS:-..}/AI-Service/.env"]
    # The playbook index, so a restart does not embed every page again.
    volumes: [playbook-index:/data]
    depends_on: [soc-llm-server]
    restart: unless-stopped
    networks: [soc-network]

  # ── Connectors ──────────────────────────────────────────────────────────
  soc-mcp-splunk:
    build: ${REPOS:-..}/MCP-Server/Splunk
    container_name: soc-mcp-splunk
    env_file: ["${REPOS:-..}/MCP-Server/.env"]
    volumes: ["${REPOS:-..}/MCP-Server/certs:/certs:ro"]
    restart: unless-stopped
    networks: [soc-network]

  soc-mcp-threatq:
    build: ${REPOS:-..}/MCP-Server/Threatq
    container_name: soc-mcp-threatq
    env_file: ["${REPOS:-..}/MCP-Server/.env"]
    volumes: ["${REPOS:-..}/MCP-Server/certs:/certs:ro"]
    restart: unless-stopped
    networks: [soc-network]

  soc-mcp-confluence:
    build: ${REPOS:-..}/MCP-Server/Confluence
    container_name: soc-mcp-confluence
    env_file: ["${REPOS:-..}/MCP-Server/.env"]
    volumes: ["${REPOS:-..}/MCP-Server/certs:/certs:ro"]
    restart: unless-stopped
    networks: [soc-network]

  # ── Dashboard ───────────────────────────────────────────────────────────
  soc-frontend:
    build: ${REPOS:-..}/Frontend
    container_name: soc-frontend
    ports: ["3001:80"]
    depends_on: [soc-core-api]
    restart: unless-stopped
    networks: [soc-network]

volumes:
  postgres-data:
  redis-data:
  ollama-data:
  llm-agents:
  playbook-index:

networks:
  soc-network:
    name: soc-network
    driver: bridge
